services:
  traccar:
    build: .
    image: likesat-traccar:local
    restart: unless-stopped
    ports:
      - "8082:8082"
      - "5000-5150:5000-5150"
      - "5000-5150:5000-5150/udp"
    volumes:
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs

volumes:
  traccar-data:
  traccar-logs:
