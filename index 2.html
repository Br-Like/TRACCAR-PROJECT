  <style>
    /* -- Reset & root layout -- */
    *, *::before, *::after { box-sizing: border-box; }

     /* -- Traccar loader (kept from original) -- */
    .loader {
      position: fixed; inset: 0; margin: auto;
      width: 40px; aspect-ratio: 1; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.15); border-right-color: #a5cce2;
      animation: spin 1s infinite linear; pointer-events: none;
      opacity: 0; /* hidden until overlay removed */
    }
    @keyframes spin { to { transform: rotate(1turn); } }

    /* -- Login overlay -- */
    #login-overlay {
      position: fixed; inset: 0; z-index: 9999;
      overflow-y: auto;
      transition: opacity 0.45s cubic-bezier(0.16,1,0.3,1);
    }

    /* -- Hero gradient -- */
    .hero-gradient {
      background: linear-gradient(140deg,
        rgba(0,48,65,0.88) 0%,
        rgba(0,26,37,0.97) 55%,
        rgba(0,10,18,1) 100%);
    }

    /* -- Grain texture overlay -- */
    .grain::after {
      content: '';
      position: absolute; inset: 0;
      //background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      //background-size: 180px;
      pointer-events: none;
      opacity: 0.5;
    }

    /* -- Glass utility -- */
    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.12);
    }

    /* -- Card -- */
    .login-card {
      background: rgba(255,255,255,0.98);
      box-shadow:
        0 0 0 1px rgba(0,26,37,0.06),
        0 4px 6px -1px rgba(0,26,37,0.06),
        0 24px 48px -12px rgba(0,26,37,0.22);
    }

    /* -- Input base -- */
    .field-input {
      width: 100%;
      padding: 12px 16px 12px 56px !important;
      background: #f0f6ff;
      border: 1.5px solid #c1c7cc;
      border-radius: 10px;
      font-size: 14px; line-height: 20px;
      color: #0b1c30;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      font-family: 'Hanken Grotesk', sans-serif;
    }
    .field-input::placeholder { color: #9ca3af; }
    .field-input:focus {
      border-color: #0070eb;
      box-shadow: 0 0 0 3px rgba(0,112,235,0.12);
    }

    /* -- Icon left in input -- */
    .field-icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-size: 20px; color: #72787c; pointer-events: none;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      transition: color 0.2s;
    }
    .field-input:focus ~ .field-icon { color: #0070eb; }

    /* Sibling trick won't work with icon after input; use JS or wrapper class instead */
    .field-wrap:focus-within .field-icon { color: #0070eb; }

    /* -- Submit button -- */
    .btn-login {
      width: 100%;
      padding: 14px 24px;
      background: #003041;
      color: #fff;
      border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; line-height: 24px;
      font-family: 'Hanken Grotesk', sans-serif;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(0,48,65,0.22);
      position: relative; overflow: hidden;
    }
    .btn-login::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 60%);
    }
    .btn-login:hover:not(:disabled) { background: #001a25; box-shadow: 0 6px 24px rgba(0,26,37,0.32); }
    .btn-login:active:not(:disabled) { transform: scale(0.985); }
    .btn-login:disabled { opacity: 0.65; cursor: not-allowed; }

    /* -- Loading spinner inside button -- */
    .btn-spinner {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.3); border-right-color: #fff;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-login.loading .btn-spinner { display: block; }
    .btn-login.loading .btn-label { display: none; }

    /* -- Error banner -- */
    .error-banner {
      display: none;
      background: #fff1f1;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px; color: #991b1b;
      align-items: flex-start; gap: 8px;
    }
    .error-banner.visible { display: flex; }

    /* -- Material icons -- */
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle; user-select: none;
    }

    /* -- Checking spinner in header -- */
    .checking-dot {
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25); border-right-color: rgba(255,255,255,0.85);
      animation: spin 0.8s linear infinite;
    }

    /* -- Responsive tweaks -- */
    @media (max-height: 660px) {
      .reduce-gap { gap: 12px !important; }
      .reduce-pad { padding-top: 12px !important; padding-bottom: 12px !important; }
    }
    @media (max-width: 360px) {
      .login-card { border-radius: 12px !important; }
    }

    //  z-index: 100; width: 100% !important;
    //}

    /* -- Link modal -- */
    #linkModal { display: none; }
    #linkModal.open { display: flex; }
  </style>
</head>

<script>
(function () {
  'use strict';
   if (!localStorage.getItem('language')) {
     localStorage.setItem('language', JSON.stringify('pt_BR'));
   }
  /* -- DOM refs -- */
  var overlay    = document.getElementById('login-overlay');
  var checking   = document.getElementById('checking');
  var errorBanner= document.getElementById('login-error');
  var errorText  = document.getElementById('error-text');
  var btn        = document.getElementById('btnLogin');
  var modal      = document.getElementById('linkModal');

async function applyDarkMapStyle() {
  try {
    const res = await _rawFetch('/api/server', {
      credentials: 'include'
    });

    if (!res.ok) return;

    const server = await res.json();

    if (server?.attributes?.darkMode === true) {

      const interval = setInterval(() => {
        const buttons = document.querySelectorAll(
          '.maplibregl-style-list button'
        );

        if (buttons.length) {
          buttons.forEach(button => {
            button.style.backgroundColor = 'black';
            button.style.color = 'white';
          });

          clearInterval(interval);
        }
      }, 500);
    }
  } catch (err) {
    console.error('Erro ao obter configurações do servidor:', err);
  }
}

  /* -- Utils -- */
  function showError(msg) {
    errorText.textContent = msg;
    errorBanner.classList.add('visible');
  }

  function hideError() {
    errorBanner.classList.remove('visible');
  }

  function setLoading(on) {
    btn.disabled = on;
    btn.classList.toggle('loading', on);
  }

  /* -- Guarda fetch original para uso interno (evita loop no interceptor) -- */
  var _rawFetch = window.fetch.bind(window);

  /* -- Instala interceptor de logout SOMENTE ap�s autentica��o -- */
  function installLogoutInterceptor() {
    window.fetch = async function () {
      var url     = arguments[0];
      var options = arguments[1] || {};
      var response = await _rawFetch.apply(window, arguments);
      if (typeof url === 'string' && url.includes('/api/session') && options.method === 'DELETE') {
        localStorage.removeItem('loginEmail');
        window.location.href = '/';
      }
      return response;
    };
  }

  /* -- Dismiss overlay & start Traccar -- */
  function enterApp() {
    if (overlay) {
      overlay.style.opacity = '0';
      setTimeout(function () {
        overlay.remove();
        document.getElementById('app-loader').style.opacity = '1';
      }, 450);
    }
    modal && modal.remove();

    setTimeout(function () {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = '/assets/index-IVSb-oO_.css';
    document.head.appendChild(css);
      var script = document.createElement('script');
      script.type = 'module';
      script.crossOrigin = 'anonymous';
      script.src = '/assets/index-5SzKMvtG.js';
var script = document.createElement('script');
script.type = 'module';
script.crossOrigin = 'anonymous';
script.src = '/assets/index-5SzKMvtG.js';

script.onload = function () {
    applyDarkMapStyle();
    function linkClick() {
        const searchDiv = document.getElementsByClassName(
            "MuiCardContent-root muiltr-1i7ecqr-content"
        );

        if (!searchDiv.length) return;

        const clickedDiv =
            searchDiv[0]
                ?.lastChild
                ?.firstChild
                ?.children?.[1]
                ?.children?.[1]
                ?.firstChild
                ?.firstChild;

        if (clickedDiv && typeof clickedDiv.click === "function") {
            clickedDiv.click();
        }
    }

    setInterval(linkClick, 300);
};

document.body.appendChild(script);
      document.body.appendChild(script);

      /* Force map repaint after Traccar mounts */
      [500, 1000, 2000].forEach(function (t) {
        setTimeout(function () { window.dispatchEvent(new Event('resize')); }, t);
      });
    }, 460);
  }

  /* -- Check existing session on load -- */
  async function checkSession() {
    try {
      // Usa _rawFetch para nunca acionar o interceptor de logout
      var res = await _rawFetch('/api/session', { method: 'GET', credentials: 'include' });
      // 200 = sess�o v�lida; 404/401 = sem sess�o (comportamento normal do Traccar)
      if (res.ok) {
        installLogoutInterceptor();
        enterApp();
        return;
      }
    } catch (e) { /* rede indispon�vel � mostra formul�rio */ }
    checking.style.display = 'none';
  }

  /* -- Login -- */
  async function doLogin() {
    hideError();
    var email    = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    if (!email || !password) { showError('Preencha e-mail e senha.'); return; }

    setLoading(true);

    try {
      // Traccar aceita JSON no POST /api/session
      var res = await _rawFetch('/api/session', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });

      // Fallback form-encoded (proxy FastAPI ou vers�o antiga do Traccar)
      if (res.status === 415 || res.status === 400) {
        var body = new URLSearchParams();
        body.append('email', email);
        body.append('password', password);
        res = await _rawFetch('/api/session', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          body: body.toString()
        });
      }

      if (!res.ok) {
        showError('Usuário ou senha inválidos.');
        setLoading(false);
        return;
      }

      localStorage.setItem('loginEmail', JSON.stringify(email));
      localStorage.setItem('hostname', location.hostname);
      installLogoutInterceptor();
      enterApp();

    } catch (err) {
      console.error(err);
      showError('Erro ao conectar ao servidor.');
      setLoading(false);
    }
  }

  /* -- Event listeners -- */
  btn.addEventListener('click', doLogin);

  document.getElementById('password').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin();
  });

  document.getElementById('pw-toggle').addEventListener('click', function () {
    var inp  = document.getElementById('password');
    var icon = document.getElementById('pw-toggle-icon');
    if (inp.type === 'password') { inp.type = 'text';     icon.textContent = 'visibility_off'; }
    else                         { inp.type = 'password'; icon.textContent = 'visibility';     }
  });

  /* -- Language selector -- */
  var langSel = document.getElementById('language');
  try { langSel.value = JSON.parse(localStorage.getItem('language') || '"pt_BR"'); } catch (e) {}
  langSel.addEventListener('change', function () {
    localStorage.setItem('language', JSON.stringify(langSel.value));
  });

  /* -- Link modal -- */
  document.getElementById('redirectButton').addEventListener('click', function () {
    modal.classList.add('open');
    setTimeout(function () { document.getElementById('customLinkInput').focus(); }, 50);
  });

  document.getElementById('cancelModal').addEventListener('click', function () {
    modal.classList.remove('open');
  });

  document.getElementById('customLinkInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('confirmModal').click(); }
    if (e.key === 'Escape') modal.classList.remove('open');
  });

  document.getElementById('confirmModal').addEventListener('click', function () {
    var val = document.getElementById('customLinkInput').value.trim();
    if (!val) { alert('Informe um endere�o.'); return; }
    window.location.href = (val.startsWith('http://') || val.startsWith('https://')) ? val : 'https://' + val;
  });

  /* -- Handle back navigation to /login -- */
  window.addEventListener('popstate', function () {
    if (location.pathname === '/login') location.replace('/');
  });

  /* -- Boot -- */
  checkSession();

})();


const recoverPassword = document.getElementById("recoverPassword");
const smsModal = document.getElementById("smsModal");
const cancelSms = document.getElementById("cancelSms");

recoverPassword.addEventListener("click", function (e) {

    smsModal.classList.remove("hidden");
    smsModal.classList.add("flex");
});

cancelSms.addEventListener("click", function () {
    smsModal.classList.remove("flex");
    smsModal.classList.add("hidden");
});

document.getElementById("sendSms").addEventListener("click", async function () {

    const phone = document.getElementById("sendEmail").value;

    const response = await fetch("https://sendersms.brasillike.com.br/api/send_sms", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            phone: phone
        })
    });

    if (response.ok) {
        alert("SMS enviado.");
        smsModal.classList.add("hidden");
        smsModal.classList.remove("flex");
    } else {
        alert("Erro ao enviar SMS.");
    }
});
</script>
